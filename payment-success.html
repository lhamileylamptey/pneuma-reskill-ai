<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a1628"><title>Payment confirmation | Pneuma Reskill AI"><style>body{margin:0;background:#0a1628;color:#eef2f9;font:16px/1.5 system-ui,sans-serif;display:grid;min-height:100vh;place-items:center;padding:20px}.box{max-width:520px;background:#12233f;border:1px solid #25406b;border-radius:18px;padding:24px}h1{color:#f5b335;font-size:1.5rem}p{color:#9fb2d0}button,a{display:inline-block;background:#f5b335;color:#1a1200;text-decoration:none;border:0;border-radius:10px;padding:12px 16px;font-weight:700;margin-top:10px}#status{white-space:pre-wrap}</style></head><body><main class="box"><h1>Pneuma Reskill AI</h1><p id="status">Checking your payment securely…</p><a href="/">Return to Pneuma Reskill AI</a></main><script>
(async()=>{const status=document.getElementById('status');const ref=new URLSearchParams(location.search).get('reference')||new URLSearchParams(location.search).get('trxref');const token=localStorage.getItem('pneuma_access_token');if(!ref){status.textContent='No payment reference was found. Return to the app and contact support if you were charged.';return}if(!token){status.textContent='Your payment reference is '+ref+'. Sign in to the same Pneuma account you used at checkout, then contact support to complete verification.';return}try{const r=await fetch('/api/verify-payment',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({reference:ref})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Verification is pending.');status.textContent='Payment confirmed. Your '+d.subscription.plan+' access is now active. You can return to the app and generate your full plan.';}catch(e){status.textContent=e.message+' If your bank was charged, do not pay again immediately. Contact Pneuma support with reference '+ref+'.'}})();
</script></body></html>
